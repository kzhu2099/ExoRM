[build-system]
requires = ['setuptools>=77.0.3', 'wheel']
build-backend = 'setuptools.build_meta'

[project]
name = 'ExoRM'
version = '4.0.8'

description = 'Experimental probabilistic models for estimating exoplanet masses from radii'
readme = 'README.md'
requires-python = '>=3.9'

authors = [
    { name = 'Kevin Zhu', email = 'kzhu2099@gmail.com' },
]
maintainers = [
    { name = 'Kevin Zhu', email = 'kzhu2099@gmail.com' },
]

license = 'MIT'
license-files = ['LICENSE']

keywords = [
    'exoplanets',
    'astronomy',
    'mass-radius relation',
    'Bayesian inference',
    'PyMC',
]

classifiers = [
    'Development Status :: 3 - Alpha',
    'Intended Audience :: Science/Research',
    'Operating System :: OS Independent',
    'Programming Language :: Python :: 3',
    'Topic :: Scientific/Engineering :: Astronomy',
    'Topic :: Scientific/Engineering :: Physics',
]

dependencies = [
    'arviz',
    'astroquery',
    'matplotlib',
    'numpy',
    'pandas',
    'platformdirs',
    'pymc',
    'pytensor',
]

[project.urls]
Homepage = 'https://github.com/kzhu2099/ExoRM'
Repository = 'https://github.com/kzhu2099/ExoRM'
Issues = 'https://github.com/kzhu2099/ExoRM/issues'

[tool.setuptools.package-data]
'ExoRM.data' = ['*']

[tool.setuptools.packages.find]
include = ['ExoRM', 'ExoRM.*']